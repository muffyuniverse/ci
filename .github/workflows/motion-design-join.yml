name: motion-design join
# Joins the two 15 s passes of a 30 s piece into one master.
# The capture tool stops at 15 000 ms, so a 30 s film is always two takes.
# Dispatch only. Artifacts out, like every other motion-design job in this shared repo:
# the private repo is read-only here and nothing is pushed back to it.
on:
  push:
    paths:
      - '.github/workflows/motion-design-join.yml'
  workflow_dispatch:
    inputs:
      theme:
        description: Piece name without suffix (h1-nervous-system)
        required: true
        default: h1-nervous-system
      branch:
        description: Branch in motion-design holding __part1.mp4 and __part2.mp4
        required: true
      aspect:
        description: '16x9 or 9x16'
        required: true
        default: '16x9'
permissions: {contents: read}
concurrency:
  group: motion-design-join-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  join:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout motion-design (private)
        uses: actions/checkout@v4
        with:
          repository: muffyuniverse/motion-design
          token: ${{ secrets.PECHKA_READ_TOKEN }}
          ref: ${{ inputs.branch }}
          path: m
      - name: Ensure ffmpeg
        # Not on the runner image: the first capture run died with "ffmpeg not found on PATH".
        run: |
          if ! command -v ffmpeg >/dev/null; then
            timeout 180 sudo apt-get update -qq || echo "::warning::apt-get update was slow or failed"
            timeout 300 sudo apt-get install -y -qq ffmpeg || { echo "::error::ffmpeg install failed"; exit 1; }
          fi
          ffmpeg -version | head -1
      - name: Check both halves exist
        working-directory: m/clients/baon/themes/delivery
        run: |
          set -euo pipefail
          ls -la
          for p in part1 part2; do
            f="${{ inputs.theme }}__$p.mp4"
            test -f "$f" || { echo "::error::missing $f"; exit 1; }
            echo "found $f ($(stat -c%s "$f") bytes)"
          done
      - name: Join
        working-directory: m/clients/baon/themes/delivery
        run: |
          set -euo pipefail
          t="${{ inputs.theme }}"
          printf "file '%s__part1.mp4'\nfile '%s__part2.mp4'\n" "$t" "$t" > list.txt
          # Re-encode, not -c copy: the halves come from separate captures, so their
          # timestamps differ by a frame and a stream copy hitches at the seam.
          ffmpeg -y -f concat -safe 0 -i list.txt \
            -c:v libx264 -crf 18 -preset medium -pix_fmt yuv420p -r 24 -movflags +faststart \
            "${t}__${{ inputs.aspect }}.mp4"
          rm -f list.txt
      - name: Assert the result is ~30 s
        working-directory: m/clients/baon/themes/delivery
        run: |
          set -euo pipefail
          out="${{ inputs.theme }}__${{ inputs.aspect }}.mp4"
          d=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$out")
          echo "duration: ${d}s"
          awk -v d="$d" 'BEGIN { if (d < 28 || d > 32) { print "::error::duration out of range: " d; exit 1 } }'
      - name: Report
        working-directory: m/clients/baon/themes/delivery
        if: always()
        run: ls -la *.mp4 || true
      - uses: actions/upload-artifact@v4
        with:
          name: motion-design-join-${{ inputs.theme }}-${{ inputs.aspect }}-${{ github.run_id }}
          path: m/clients/baon/themes/delivery/${{ inputs.theme }}__${{ inputs.aspect }}.mp4
          retention-days: 14
