name: motion-design capture
# The non-Remotion path: Puppeteer drives a page that implements renderAt/sceneInfo/setScene, calls
# it frame by frame, and ffmpeg encodes. Proves the DOM/canvas route works on a runner, not just in
# a browser on someone's desk.
#
# Inputs added 2026-11-18 so the same job renders any film without editing this file. The checkout
# used to take the default branch, which meant a piece living in a delivery branch could not be
# rendered at all — and delivery artifacts are explicitly not merged to main.
on:
  push:
    paths:
      - '.github/workflows/motion-design-capture.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: Branch of motion-design to render
        required: false
        default: main
      page:
        description: Page implementing renderAt / sceneInfo / setScene
        required: false
        default: workbench/video/studio.html
      scenes:
        description: Comma-separated scene names
        required: false
        default: mark,loop,vertical
      fps:
        description: Frames per second
        required: false
        default: '30'
permissions: {contents: read}
concurrency:
  group: motion-design-capture-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout motion-design (private)
        uses: actions/checkout@v4
        with:
          repository: muffyuniverse/motion-design
          token: ${{ secrets.PECHKA_READ_TOKEN }}
          ref: ${{ inputs.ref || 'main' }}
          path: m
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Ensure ffmpeg
        # Not on the runner image, whatever the image docs suggest: the first capture run died with
        # "ffmpeg not found on PATH" one second in. Bounded, like every other network step.
        run: |
          if ! command -v ffmpeg >/dev/null; then
            timeout 180 sudo apt-get update -qq || echo "::warning::apt-get update was slow or failed"
            timeout 300 sudo apt-get install -y -qq ffmpeg || { echo "::error::ffmpeg install failed"; exit 1; }
          fi
          ffmpeg -version | head -1
      - name: Cache node_modules and the browser
        uses: actions/cache@v4
        with:
          path: |
            m/ci/node_modules
            ~/.cache/puppeteer
          key: motion-design-puppeteer-${{ runner.os }}-${{ hashFiles('m/ci/package.json') }}
      - name: Install
        working-directory: m/ci
        run: npm install --no-audit --no-fund
      - name: Capture frames and encode
        working-directory: m
        # Single quotes around each value: the page query carries & and ?, and an unquoted &
        # would background the process and silently render nothing.
        run: |
          node ci/render.mjs \
            --page '${{ inputs.page || 'workbench/video/studio.html' }}' \
            --scenes '${{ inputs.scenes || 'mark,loop,vertical' }}' \
            --fps '${{ inputs.fps || '30' }}' \
            --out out
      - name: Report
        working-directory: m
        if: always()
        run: |
          ls -la out || true
          cat out/render-report.json || true
          cat out/render-error.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: motion-design-capture-${{ github.run_id }}
          path: |
            m/out/*.mp4
            m/out/*-poster.png
            m/out/render-report.json
            m/out/render-error.txt
          retention-days: 14
          if-no-files-found: warn
