name: tool probes (heavy)
# Manual only, with explicit selection. These jobs are slow and expensive, and editing this file
# should not silently re-render both of them.
on:
  workflow_dispatch:
    inputs:
      manim:
        description: 'Run the Manim probe'
        type: boolean
        default: true
      blender:
        description: 'Run the Blender probe'
        type: boolean
        default: false
permissions: {contents: read}
concurrency:
  group: tool-probes-heavy-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  manim:
    if: ${{ inputs.manim }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: muffyuniverse/motion-design
          token: ${{ secrets.PECHKA_READ_TOKEN }}
          path: m
      - name: System dependencies, TeX included
        # MathTex shells out to latex and dvisvgm. Without them the scene dies with
        # FileNotFoundError: 'latex' — a missing package, not a Manim problem.
        run: |
          timeout 600 sudo apt-get update -qq || echo "::warning::apt-get update was slow or failed"
          timeout 1800 sudo apt-get install -y -qq ffmpeg build-essential pkg-config libcairo2-dev libpango1.0-dev python3-dev texlive-latex-base texlive-latex-extra texlive-fonts-recommended dvisvgm || { echo "::error::system deps failed"; exit 1; }
          latex --version | head -1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install manim
        working-directory: m
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip -q
          timeout 900 .venv/bin/pip install -q manim || { echo "::error::manim install failed"; exit 1; }
          .venv/bin/manim --version
      - name: Render
        working-directory: m
        run: .venv/bin/manim -ql --media_dir out/manim probes/manim/scene.py Probe
      - name: Verify output
        working-directory: m
        run: |
          find out/manim -name '*.mp4' -print || true
          test -n "$(find out/manim -name '*.mp4' -size +1k -print -quit)" || { echo "::error::manim produced no mp4"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-manim-${{ github.run_id }}
          path: m/out/manim/**/*.mp4
          retention-days: 14
          if-no-files-found: warn
  blender:
    if: ${{ inputs.blender }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: muffyuniverse/motion-design
          token: ${{ secrets.PECHKA_READ_TOKEN }}
          path: m
      - name: Runtime libraries
        run: |
          timeout 600 sudo apt-get update -qq || echo "::warning::apt-get update was slow or failed"
          timeout 900 sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxkbcommon0 libgl1 libsm6 libice6 || { echo "::error::blender runtime libs failed"; exit 1; }
      - name: Install blender from the pinned tarball
        # apt-get install blender pulled a dependency tree big enough to blow a 15-minute ceiling.
        # The official tarball is 335 MB and self-contained.
        run: |
          curl -sSL --retry 3 -o /tmp/blender.tar.xz https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz
          mkdir -p /opt/blender
          tar -xf /tmp/blender.tar.xz -C /opt/blender --strip-components=1
          /opt/blender/blender --version | head -3
      - name: Render three frames
        working-directory: m
        run: timeout 1200 /opt/blender/blender -b -P probes/blender/scene.py
      - name: Verify frames
        working-directory: m
        run: |
          ls -la out/blender || true
          n=$(ls out/blender/*.png 2>/dev/null | wc -l)
          echo "frames=$n"
          test "$n" -ge 3 || { echo "::error::expected 3 frames, got $n"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-blender-${{ github.run_id }}
          path: m/out/blender/*.png
          retention-days: 14
          if-no-files-found: warn
