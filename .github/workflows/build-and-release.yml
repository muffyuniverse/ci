name: Build and release

on:
  repository_dispatch:
    types: [project-push]
  workflow_dispatch:
    inputs:
      version_name:
        description: "A name for this build. It is a label, not a release."
        required: false
        type: string
      release_build:
        description: "Also build a release APK. Off by default: a release is what ships at the end."
        required: false
        type: boolean
        default: false
      ssh_debug:
        description: "Hold the test job open for an SSH session (only if it fails)"
        required: false
        type: boolean
        default: false

env:
  PROJECT_REPO: muffyuniverse/pechka-ai

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(vars.TEST_SHARDS || '[0,1,2]') }}

    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
          repository: ${{ env.PROJECT_REPO }}
          token: ${{ secrets.PECHKA_READ_TOKEN }}
          ref: ${{ github.event.client_payload.sha || 'main' }}

      - name: Record checked-out revision
        run: echo "checked out $(git rev-parse HEAD)"

      - name: Work out this shard's share
        id: shard
        env:
          SHARD: ${{ matrix.shard }}
          SHARD_OF: ${{ strategy.job-total }}
        run: |
          classes="$(bash tools/test-shard.sh --shard "$SHARD" --of "$SHARD_OF" \
            | grep '^ai\.pechka\.' | paste -sd, -)"
          if [ -z "$classes" ]; then
            echo "::error::This shard was dealt no test classes at all."
            exit 1
          fi
          echo "classes=$classes" >> "$GITHUB_OUTPUT"
          echo "this shard runs $(echo "$classes" | tr ',' '\n' | grep -c .) classes"

      - name: Check zero comments and artifact cipher
        if: matrix.shard == 0
        run: |
          python3 tools/check-no-comments.py --self-test
          python3 tools/check-no-comments.py
          python3 tools/artifact-cipher.py --self-test

      - name: Check the workflow itself
        if: matrix.shard == 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/check-workflow.py

      - name: Check that the workflow is readable YAML
        if: matrix.shard == 0
        run: |
          python3 tools/check-yaml.py --self-test
          python3 tools/check-yaml.py
          python3 tools/render-ci-workflow.py --self-test
          python3 tools/check-shards.py

      - name: Check that the public repository's copy is what this one renders to
        if: matrix.shard == 0
        env:
          GH_TOKEN: ${{ secrets.PECHKA_READ_TOKEN }}
          PUBLIC_REPO: muffyuniverse/ci
        run: |
          if ! gh api "repos/$PUBLIC_REPO/contents/.github/workflows/build-and-release.yml" \
              --jq '.content' 2>/dev/null | base64 -d > /tmp/public-copy.yml 2>/dev/null \
              || [ ! -s /tmp/public-copy.yml ]; then
            echo "::warning title=Public copy::the public repository's copy could not be read, so it was not compared."
            exit 0
          fi
          python3 tools/render-ci-workflow.py --check --out /tmp/public-copy.yml

      - name: Check that the test map and the tests agree
        if: matrix.shard == 0
        run: python3 tools/check-test-map.py

      - name: Check that the log's vocabulary is the standard one
        if: matrix.shard == 0
        run: python3 tools/check-taps.py

      - name: Check that no string reads a property off a toString
        if: matrix.shard == 0
        run: python3 tools/check-interpolation.py

      - name: Check that the version code only ever goes up
        if: matrix.shard == 0
        run: bash tools/version-code.sh --self-test

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
        with:
          cache-cleanup: never
          cache-read-only: ${{ github.event_name == 'pull_request' || matrix.shard != 0 }}

      - name: Say what this machine has
        run: |
          echo "processors: $(nproc)"
          awk '/MemTotal/ {printf "memory: %.1f GB\n", $2/1024/1024}' /proc/meminfo

      - name: Work out which Android runtime the tests need
        id: robolectric
        run: |
          version="$(grep -oE 'org\.robolectric:robolectric:[0-9][^"\x27 ]*' \
            app/build.gradle.kts | head -1 | sed 's/.*://')"
          if [ -z "$version" ]; then
            echo "::error::Could not find the Robolectric version in app/build.gradle.kts."
            exit 1
          fi
          echo "robolectric $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Remember the runtime the tests need
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.m2/repository
          key: robolectric-runtime-${{ steps.robolectric.outputs.version }}-${{ runner.os }}

      - name: Remember how the project is put together
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .gradle/configuration-cache
          key: config-cache-v4-tests-${{ matrix.shard }}-${{ runner.os }}-${{ github.event_name == 'pull_request' && 'pr' || 'build' }}-${{ hashFiles('**/*.gradle.kts', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Run the tests
        env:
          EVENT_NAME: ${{ github.event_name }}
          PECHKA_ONLY_TESTS: ${{ steps.shard.outputs.classes }}
        run: |
          tasks=()
          case ",$PECHKA_ONLY_TESTS," in
            *,ai.pechka.browser.*,*) tasks+=(:browser:testDebugUnitTest) ;;
          esac
          if printf '%s' "$PECHKA_ONLY_TESTS" | tr ',' '\n' | grep -qv '^ai\.pechka\.browser\.'; then
            tasks+=(:app:testDebugUnitTest)
          fi
          if [ "$EVENT_NAME" != "pull_request" ]; then
            ./gradlew --parallel --no-daemon --configuration-cache \
                --profile "${tasks[@]}" -Ppechka.shots
          else
            ./gradlew --parallel --no-daemon --configuration-cache \
                --profile "${tasks[@]}"
          fi

      - name: Say what actually failed, in words
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          shown = 0
          for f in sorted(glob.glob("*/build/test-results/**/TEST-*.xml", recursive=True)):
              try:
                  root = ET.parse(f).getroot()
              except Exception:
                  continue
              for case in root.iter("testcase"):
                  for fail in case.iter("failure"):
                      msg = (fail.get("message") or "").strip().splitlines()
                      print(f"::error title={case.get('classname')}::{case.get('name')}")
                      if msg:
                          print(f"  {msg[0][:600]}")
                      shown += 1
          if shown:
              print(f"{shown} failing test(s)")
          else:
              print("::error title=The suite did not run::No test-result XML was written.")
          PY

      - name: Open an SSH session on the runner
        if: failure() && inputs.ssh_debug
        uses: owenthereal/action-upterm@6c2d60e09009f59cb4c45c88767c78701f14d121
        with:
          limit-access-to-users: muffyuniverse,Zhukov-Alexander
          full-access: true
          detached: true
          wait-timeout-minutes: 10

      - name: Check that the tests that ran are the tests that were asked for
        if: always()
        env:
          PECHKA_ONLY_TESTS: ${{ steps.shard.outputs.classes }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "failure" ]; then
            python3 tools/check-results.py --expect "" || true
            exit 0
          fi
          python3 tools/check-results.py --expect "$PECHKA_ONLY_TESTS"

      - name: Say whether the suite still scales
        if: always()
        env:
          SHARD_OF_TOTAL: ${{ strategy.job-total }}
        run: python3 tools/scaling-report.py --shards "$SHARD_OF_TOTAL"

      - name: Say where the test job's time went
        if: always()
        run: python3 tools/build-times.py --results . --top 8 --label test --no-budget

      - name: Seal the scenarios
        if: always()
        env:
          PECHKA_ARTIFACT_KEY: ${{ secrets.PECHKA_ARTIFACT_KEY }}
        run: |
          if [ -d app/build/outputs/scenarios ] && [ -n "${PECHKA_ARTIFACT_KEY:-}" ]; then
            python3 tools/artifact-cipher.py seal \
              --in app/build/outputs/scenarios \
              --out "$RUNNER_TEMP/scenarios.seal"
          fi

      - name: Keep the scenarios
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: scenarios-${{ matrix.shard }}
          path: ${{ runner.temp }}/scenarios.seal
          if-no-files-found: ignore
          retention-days: 7

      - name: Seal the test report when something failed
        if: failure()
        env:
          PECHKA_ARTIFACT_KEY: ${{ secrets.PECHKA_ARTIFACT_KEY }}
        run: |
          if [ -n "${PECHKA_ARTIFACT_KEY:-}" ]; then
            mkdir -p "$RUNNER_TEMP/report-src"
            for d in app/build/reports/tests app/build/test-results browser/build/reports/tests browser/build/test-results; do
              if [ -d "$d" ]; then
                mkdir -p "$RUNNER_TEMP/report-src/$(dirname "$d")"
                cp -R "$d" "$RUNNER_TEMP/report-src/$d"
              fi
            done
            if [ -n "$(ls -A "$RUNNER_TEMP/report-src" 2>/dev/null)" ]; then
              python3 tools/artifact-cipher.py seal \
                --in "$RUNNER_TEMP/report-src" \
                --out "$RUNNER_TEMP/test-report.seal"
            fi
          fi

      - name: Keep the test report when something failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: test-report-${{ matrix.shard }}
          path: ${{ runner.temp }}/test-report.seal
          if-no-files-found: ignore
          retention-days: 7


  lint:
    name: Deep checks
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || github.event_name == 'repository_dispatch'
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
          repository: ${{ env.PROJECT_REPO }}
          token: ${{ secrets.PECHKA_READ_TOKEN }}
          ref: ${{ github.event.client_payload.sha || 'main' }}

      - name: Did the app change
        id: decision
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          TOOLS_DIR: ${{ github.workspace }}/tools
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$EVENT_NAME" = "repository_dispatch" ]; then
            echo "changed=yes" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="$(bash "$TOOLS_DIR/push-base.sh" "$BEFORE")"
          verdict="$(bash "$TOOLS_DIR/changed-tests.sh" --base "$base")"
          if [ "$verdict" = "NONE" ]; then
            echo "changed=no" >> "$GITHUB_OUTPUT"
          else
            echo "changed=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java
        if: steps.decision.outputs.changed == 'yes'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        if: steps.decision.outputs.changed == 'yes'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
        with:
          cache-cleanup: never
          cache-read-only: true

      - name: Run the analysis
        if: steps.decision.outputs.changed == 'yes'
        run: ./gradlew --parallel --no-daemon --no-configuration-cache lintRelease


  build:
    name: Build the app
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.PROJECT_REPO }}
          token: ${{ secrets.PECHKA_READ_TOKEN }}
          ref: ${{ github.event.client_payload.sha || 'main' }}
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
        with:
          cache-cleanup: never
          cache-read-only: true

      - name: Put the signing key in place
        env:
          PECHKA_KEYSTORE_BASE64: ${{ secrets.PECHKA_KEYSTORE_BASE64 }}
          PECHKA_KEYSTORE_PASSWORD: ${{ secrets.PECHKA_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$PECHKA_KEYSTORE_BASE64" ]; then
            echo '::error::PECHKA_KEYSTORE_BASE64 is empty, so a release cannot be signed.'
            exit 1
          fi
          if [ -z "$PECHKA_KEYSTORE_PASSWORD" ]; then
            echo '::error::PECHKA_KEYSTORE_PASSWORD is empty, so the keystore cannot be opened.'
            exit 1
          fi
          printf '%s' "$PECHKA_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/check.jks"
          if [ ! -s "$RUNNER_TEMP/check.jks" ]; then
            echo '::error::PECHKA_KEYSTORE_BASE64 decodes to nothing.'
            exit 1
          fi

      - name: Work out the version
        id: version
        env:
          CHOSEN_VERSION: ${{ inputs.version_name }}
          RELEASE_BUILD: ${{ inputs.release_build }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ -n "${CHOSEN_VERSION:-}" ]; then
            name="$CHOSEN_VERSION"
          else
            name="$RUN_NUMBER"
          fi
          case "$name" in
            ''|*[!A-Za-z0-9._-]*)
              echo "The version name may only hold letters, digits, dots and dashes."
              exit 1
              ;;
          esac
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "code=$(( 1000000000 + RUN_NUMBER ))" >> "$GITHUB_OUTPUT"
          echo "The version is ${name} (code $(( 1000000000 + RUN_NUMBER )))."
          if [ "${RELEASE_BUILD:-false}" = "true" ]; then
            echo "A release APK is built as well, because it was asked for."
          else
            echo "A debug copy is built. No release APK is made, and nothing is published."
          fi

      - name: Build the debug copy
        if: github.event_name != 'pull_request'
        env:
          PECHKA_KEYSTORE_BASE64: ${{ secrets.PECHKA_KEYSTORE_BASE64 }}
          PECHKA_KEYSTORE_PASSWORD: ${{ secrets.PECHKA_KEYSTORE_PASSWORD }}
          PECHKA_KEY_ALIAS: ${{ secrets.PECHKA_KEY_ALIAS }}
          PECHKA_KEY_PASSWORD: ${{ secrets.PECHKA_KEY_PASSWORD }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          ./gradlew --parallel --no-daemon --no-configuration-cache assembleDebug \
            -Ppechka.versionCode="$VERSION_CODE" \
            -Ppechka.versionName="$VERSION_NAME"

      - name: Build the release
        if: inputs.release_build
        env:
          PECHKA_KEYSTORE_BASE64: ${{ secrets.PECHKA_KEYSTORE_BASE64 }}
          PECHKA_KEYSTORE_PASSWORD: ${{ secrets.PECHKA_KEYSTORE_PASSWORD }}
          PECHKA_KEY_ALIAS: ${{ secrets.PECHKA_KEY_ALIAS }}
          PECHKA_KEY_PASSWORD: ${{ secrets.PECHKA_KEY_PASSWORD }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          ./gradlew --parallel --no-daemon --no-configuration-cache --profile assembleRelease \
            -x lintVitalRelease \
            -Ppechka.versionCode="$VERSION_CODE" \
            -Ppechka.versionName="$VERSION_NAME"

      - name: Say where the build's time went
        if: always()
        run: python3 tools/build-times.py --results . --top 10

      - name: Check the signature of the APK
        env:
          EXPECTED_CERT: ${{ vars.EXPECTED_CERT }}
          RELEASE_BUILD: ${{ inputs.release_build }}
        run: |
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/*/ 2>/dev/null | sort -V | tail -1)"
          BUILD_TOOLS="${BUILD_TOOLS%/}"
          if [ -z "$BUILD_TOOLS" ] || [ ! -x "$BUILD_TOOLS/apksigner" ]; then
            echo "::error::No Android build tools found under $ANDROID_HOME"
            exit 1
          fi
          apks=(app/build/outputs/apk/debug/app-debug.apk)
          if [ "${RELEASE_BUILD:-false}" = "true" ]; then
            apks+=(app/build/outputs/apk/release/app-release.apk)
          fi
          if [ -z "${EXPECTED_CERT:-}" ]; then
            echo "::error::EXPECTED_CERT is not set, so the APK's signer cannot be checked."
            exit 1
          fi
          expected="$(printf '%s' "$EXPECTED_CERT" | tr -d ' :' | tr 'A-F' 'a-f')"
          for APK in "${apks[@]}"; do
            if [ ! -f "$APK" ]; then
              echo "::error::There is no APK at $APK, so there is nothing to check."
              exit 1
            fi
            if ! "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" > certs.txt 2>&1; then
              echo "::error::apksigner could not read the APK's certificates:"
              cat certs.txt
              exit 1
            fi
            "$BUILD_TOOLS/apksigner" verify "$APK"
            "$BUILD_TOOLS/zipalign" -c 4 "$APK"
            signer="$(sed -n 's/.*SHA-256 digest:[[:space:]]*//p' certs.txt \
              | head -1 | tr -d ' :' | tr 'A-F' 'a-f')"
            if [ "$signer" != "$expected" ]; then
              echo "::error::The APK $APK is signed by $signer, not by $expected."
              exit 1
            fi
          done
          echo "signed by the expected certificate"

      - name: Wait for tests and lint before sealing the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deadline=$((SECONDS + 1200))
          while :; do
            rows=""
            for attempt in 1 2 3; do
              rows="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --paginate \
                --jq '.jobs[] | select((.name | startswith("Test")) or .name == "Deep checks")
                      | "\(.status)\t\(.conclusion // "-")\t\(.name)"' 2>/dev/null)" && break
              sleep 5
            done
            if [ -z "$rows" ]; then
              echo "::error::Could not read test/lint job status."
              exit 1
            fi
            running=0
            failed=""
            total=0
            while IFS=$'\t' read -r status conclusion name; do
              [ -n "$status" ] || continue
              total=$((total + 1))
              if [ "$status" != "completed" ]; then
                running=$((running + 1))
              elif [ "$conclusion" != "success" ]; then
                failed="$failed $name($conclusion)"
              fi
            done <<< "$rows"
            if [ "$total" -lt 2 ]; then
              echo "::error::Expected Test and Deep checks jobs in run, found $total."
              exit 1
            fi
            if [ -n "$failed" ]; then
              echo "::error::Verification failed:${failed}. Refusing to publish APK artifact."
              exit 1
            fi
            [ "$running" -eq 0 ] && break
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::Timed out waiting for Test and Deep checks."
              exit 1
            fi
            echo "$running of $total verification jobs still running..."
            sleep 10
          done
          echo "All $total verification jobs succeeded."

      - name: Seal the build bundle
        env:
          PECHKA_ARTIFACT_KEY: ${{ secrets.PECHKA_ARTIFACT_KEY }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          if [ -z "${PECHKA_ARTIFACT_KEY:-}" ]; then
            echo "::error::PECHKA_ARTIFACT_KEY is empty; refusing to upload unencrypted artifact to public CI."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/pechka-bundle"
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/pechka-bundle/"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/pechka-bundle/"
          fi
          printf '%s\n' "$VERSION_NAME" > "$RUNNER_TEMP/pechka-bundle/version"
          git rev-parse HEAD > "$RUNNER_TEMP/pechka-bundle/sha"
          python3 tools/artifact-cipher.py seal \
            --in "$RUNNER_TEMP/pechka-bundle" \
            --out "$RUNNER_TEMP/pechka-bundle.seal"

      - name: Hand the sealed bundle onward
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pechka-bundle
          path: ${{ runner.temp }}/pechka-bundle.seal
          retention-days: 7
          if-no-files-found: error
