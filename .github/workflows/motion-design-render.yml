name: motion-design render
# This repo is shared by every private project on the account, so this workflow is namespaced by
# project and deliberately has no bare `push:` trigger — that would fire on every other project's
# push. It runs on manual dispatch, or when this file itself changes.
on:
  push:
    paths:
      - '.github/workflows/motion-design-render.yml'
  workflow_dispatch:
permissions: {contents: read}
# One group per RUN, not per branch. Two dispatches are two independent renders, and neither may
# cancel the other. An earlier motion-design-<ref> group made a second dispatch silently supersede
# the first, which reads as a vanished run and throws away work already done.
concurrency:
  group: motion-design-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout motion-design (private)
        uses: actions/checkout@v4
        with:
          repository: muffyuniverse/motion-design
          token: ${{ secrets.PECHKA_READ_TOKEN }}
          path: m
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/cache@v4
        with:
          path: m/ci/remotion/node_modules
          key: motion-design-remotion-${{ runner.os }}-${{ hashFiles('m/ci/remotion/package.json') }}
      - name: Render, shard and join
        working-directory: m
        run: bash ci/run.sh
      - uses: actions/upload-artifact@v4
        with:
          name: motion-design-brand-reveal-${{ github.run_id }}
          path: m/ci/out/brand-reveal.mp4
          retention-days: 14
